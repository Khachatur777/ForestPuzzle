<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Puzzle</title>
<link rel="icon" href="icon.png">
<style>
:root { --bg: #f6f3ea; --card: #fffdf7; --text: #2d2a22; --muted: #6b6455; --link: #2f7a3a; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1f1a; --card: #262922; --text: #ece8dc; --muted: #a9a392; --link: #8fd18f; }
}
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
.card { background: var(--card); border-radius: 18px; padding: 8px 24px 24px; }
h1 { font-size: 30px; line-height: 1.25; }
h2 { font-size: 21px; margin-top: 28px; }
a { color: var(--link); overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.icon { width: 112px; height: 112px; border-radius: 26px; display: block; margin: 24px auto 0; }
.center { text-align: center; }
</style>
</head>
<body>
<main>
<div class="card">
<img class="icon" src="icon.png" alt="">
<h1 class="center">Forest Puzzle</h1>
<p class="center muted">A cosy puzzle game in the forest: help the animals gather their food.</p>
<p class="center"><a href="privacy.html">Privacy Policy</a></p>
<p class="center muted">Contact: <a href="mailto:petrosyankhachatur1@gmail.com">petrosyankhachatur1@gmail.com</a></p>
</div>
</main>
</body>
</html>
